name: diag-peerjs
on:
  push:
    branches: [claude/diag-peerjs]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/web-ajustes-sonido, path: src }
      - uses: actions/checkout@v4
        with: { path: diag }
      - name: Godot
        run: |
          base=https://github.com/godotengine/godot/releases/download/4.7.1-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates/4.7.1.stable
          curl -sSL -o godot.zip $base/Godot_v4.7.1-stable_linux.x86_64.zip && unzip -q godot.zip -d ~/godot && mv ~/godot/Godot_v* ~/godot/godot
          curl -sSL -o tpl.tpz $base/Godot_v4.7.1-stable_export_templates.tpz && unzip -qj tpl.tpz 'templates/web_*' 'templates/version.txt' -d ~/.local/share/godot/export_templates/4.7.1.stable
          cd src && mkdir -p build/web && (~/godot/godot --headless --path . --import || true) && ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
      - run: cd src && npm i peer playwright@1 && npx playwright install --with-deps chromium
      - name: prueba con 0.peerjs.com
        run: |
          cd src
          mkdir -p tests/logs/web && cp -r build/web/. tests/logs/web/
          sed -i 's/"args":\[\]/"args":["--"].concat((new URLSearchParams(location.search).get("args")||"").split(" ").filter(Boolean))/' tests/logs/web/index.html
          (python3 -m http.server 8765 --directory tests/logs/web > /dev/null 2>&1 &) ; sleep 2
          SIGNAL=public timeout 900 node tests/web/online_test.js 2 2 coin_grab 2>&1 | tee $GITHUB_WORKSPACE/diag.txt || true
      - name: guardar log
        if: always()
        run: |
          cd diag && cp ../diag.txt . && git config user.name bot && git config user.email bot@x && git add diag.txt && git commit -qm "diag log [skip ci]" && git push -q origin HEAD:claude/diag-peerjs
